<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Monitor Desktop app icon: the website's mark (docs/public/favicon.svg)
       — Studio's titled frame (╭─◆───╮) holding a KPI gauge (━━━━──) —
       drawn on the macOS icon grid: an 824 px tile with a 100 px margin, so
       the favicon's 64-unit artwork is scaled by 824/64. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18202A"/>
      <stop offset="100%" stop-color="#0E131A"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA39B"/>
      <stop offset="100%" stop-color="#FF8A80"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <g transform="translate(100 100) scale(12.875)">
    <path d="M30 17H48a5 5 0 0 1 5 5V45a5 5 0 0 1-5 5H16a5 5 0 0 1-5-5V22a5 5 0 0 1 5-5h1"
          fill="none" stroke="#5A626E" stroke-width="3" stroke-linecap="round"/>
    <path d="M23.5 10.5L30 17L23.5 23.5L17 17Z" fill="url(#brand)"/>
    <path d="M19 34.5H36" stroke="#FF8A80" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 34.5H45" stroke="#5A626E" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
