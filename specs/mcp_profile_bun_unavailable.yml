version: 1
name: monitor_mcp_profile_bun_unavailable

intent: |
  Bug 5 / E1.7: Bun speaks the WebKit/JSC inspector protocol on its
  --inspect port, not V8's Chrome DevTools Protocol. Before this fix,
  monitor_profile_capture (and `monitor profile`) treated any Node-family
  --inspect process the same way and tried CDP discovery (GET /json/list)
  against Bun's inspector, which 404s -- a confusing, uninformative
  failure a caller could easily mistake for "nothing is listening" rather
  than "wrong protocol".

  captureRuntimeAwareProfile detects RuntimeBun (via procbind) BEFORE
  attempting any CDP discovery and fails fast with an honest limitation
  instead. This spec verifies, against a REAL `bun --inspect` process (not
  a stub), that monitor_profile_capture over MCP for both type:cpu and
  type:heap comes back captured:false with an error that names the real
  cause (mentions Bun's JSC/WebKit inspector) and never mentions 404 or
  "Not Found".

target:
  cmd:
    [
      "sh",
      "-c",
      "mkdir -p /tmp/monitor-spec-mcp-bun; bun --inspect examples/polyglot/js/workload.js >/tmp/monitor-spec-mcp-bun/target.stderr.log 2>&1 & P=$!; sleep 1; { printf '%s\\n%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"method\":\"notifications/initialized\"}' \"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":2,\\\"method\\\":\\\"tools/call\\\",\\\"params\\\":{\\\"name\\\":\\\"monitor_profile_capture\\\",\\\"arguments\\\":{\\\"pid\\\":$P,\\\"type\\\":\\\"cpu\\\",\\\"confirm\\\":true}}}\"; sleep 4; } | ./bin/monitor mcp serve 2>&1 | tail -1 > /tmp/monitor-spec-mcp-bun/target.json; kill \"$P\" 2>/dev/null; exit 0",
    ]
  cwd: "."

terminal:
  cols: 200
  rows: 80
  profile: xterm-256color

preconditions:
  commands:
    - run: "test -x ./bin/monitor"
      timeoutMs: 5000
    - run: "command -v bun"
      timeoutMs: 5000
    - run: "command -v python3"
      timeoutMs: 5000
    - run: "test -f examples/polyglot/js/workload.js"
      timeoutMs: 5000
    - run: "mkdir -p /tmp/monitor-spec-mcp-bun"
      timeoutMs: 5000

steps:
  - wait:
      process:
        exitCode: 0
      timeoutMs: 20000

outcomes:
  - id: cpu_type_is_honest_not_a_404
    description: |
      type:cpu against a real bun --inspect process: captured:false, error
      mentions Bun's JSC/WebKit inspector, never "404" or "Not Found".
    verify:
      command:
        timeoutMs: 20000
        run: "bun --inspect examples/polyglot/js/workload.js >/tmp/monitor-spec-mcp-bun/cpu.stderr.log 2>&1 & P=$!; sleep 1; { printf '%s\\n%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"method\":\"notifications/initialized\"}' \"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":2,\\\"method\\\":\\\"tools/call\\\",\\\"params\\\":{\\\"name\\\":\\\"monitor_profile_capture\\\",\\\"arguments\\\":{\\\"pid\\\":$P,\\\"type\\\":\\\"cpu\\\",\\\"confirm\\\":true}}}\"; sleep 4; } | ./bin/monitor mcp serve 2>&1 | tail -1 > /tmp/monitor-spec-mcp-bun/cpu.json; kill \"$P\" 2>/dev/null; python3 -c \"import json;d=json.load(open('/tmp/monitor-spec-mcp-bun/cpu.json'));sc=d['result']['structuredContent'];assert sc.get('captured') is False, sc;err=sc.get('error','');assert 'JSC' in err or 'WebKit' in err, err;assert '404' not in err, err;assert 'Not Found' not in err, err\""
  - id: heap_type_is_also_honest_not_a_404
    description: |
      type:heap against the same real bun --inspect process behaves
      identically to type:cpu -- Bun's inspector never speaks CDP for
      either capture kind.
    verify:
      command:
        timeoutMs: 20000
        run: "bun --inspect examples/polyglot/js/workload.js >/tmp/monitor-spec-mcp-bun/heap.stderr.log 2>&1 & P=$!; sleep 1; { printf '%s\\n%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"method\":\"notifications/initialized\"}' \"{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":2,\\\"method\\\":\\\"tools/call\\\",\\\"params\\\":{\\\"name\\\":\\\"monitor_profile_capture\\\",\\\"arguments\\\":{\\\"pid\\\":$P,\\\"type\\\":\\\"heap\\\",\\\"confirm\\\":true}}}\"; sleep 4; } | ./bin/monitor mcp serve 2>&1 | tail -1 > /tmp/monitor-spec-mcp-bun/heap.json; kill \"$P\" 2>/dev/null; python3 -c \"import json;d=json.load(open('/tmp/monitor-spec-mcp-bun/heap.json'));sc=d['result']['structuredContent'];assert sc.get('captured') is False, sc;err=sc.get('error','');assert 'JSC' in err or 'WebKit' in err, err;assert '404' not in err, err;assert 'Not Found' not in err, err\""
