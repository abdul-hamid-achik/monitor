version: 1
name: monitor_v2_help

intent: |
  `monitor v2 --help` documents the Bubble Tea v2 prototype TUI and lists
  the same flags/usage shape as the other subcommands. This proves the v2
  subcommand is wired into the cobra command tree without crashing.

target:
  cmd: ["./bin/monitor", "v2", "--help"]
  cwd: "."

terminal:
  cols: 120
  rows: 40
  profile: xterm-256color

preconditions:
  commands:
    - run: "test -x ./bin/monitor"
      timeoutMs: 5000

steps:
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: subcommand_listed
    description: monitor --help lists the v2 subcommand
    verify:
      command:
        run: "./bin/monitor --help | grep -qE '^[[:space:]]+v2[[:space:]]+Launch the Bubble Tea v2'"
  - id: v2_help_describes_v2
    description: v2 --help mentions the charm.land v2 libraries
    verify:
      command:
        run: "./bin/monitor v2 --help | grep -q 'charm.land/bubbletea/v2'"
  - id: v2_help_mentions_all_tabs
    description: v2 --help mentions all 8 tabs or the default TUI
    verify:
      command:
        run: "./bin/monitor v2 --help | grep -qiE 'all 8 tabs|Overview.*CPU.*Memory'"
  - id: clean_exit
    description: v2 --help exits cleanly
    verify:
      process:
        exitCode: 0
