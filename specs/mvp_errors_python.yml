version: 1
name: monitor_mvp_errors_python

intent: |
  Golden-table coverage (docs/contracts/local-sentry-naming.md,
  "python 11 -> 2"): `monitor run -- python3 examples/polyglot/python/
  workload.py` must group the repeated handled ValueError (flaky_parse)
  tracebacks into ONE issue and the single uncaught RuntimeError
  (detonate) into a SECOND, each with the right culprit file:line.
  WORKLOAD_SECONDS=3 (the short knob) crashes the workload in ~3s
  instead of 40s.

target:
  cmd:
    [
      "./bin/monitor",
      "run",
      "--",
      "python3",
      "examples/polyglot/python/workload.py",
    ]
  cwd: "."
  env:
    XDG_STATE_HOME: "/tmp/monitor-spec-mvp-python/state"
    MONITOR_ISSUES_STORE: "/tmp/monitor-spec-mvp-python/data/issues.veclite"
    WORKLOAD_SECONDS: "3"

terminal:
  cols: 200
  rows: 60
  profile: xterm-256color

preconditions:
  commands:
    - run: "test -x ./bin/monitor"
      timeoutMs: 5000
    - run: "command -v python3"
      timeoutMs: 5000
    - run: "test -f examples/polyglot/python/workload.py"
      timeoutMs: 5000
    - run: "rm -rf /tmp/monitor-spec-mvp-python && mkdir -p /tmp/monitor-spec-mvp-python/state /tmp/monitor-spec-mvp-python/data"
      timeoutMs: 5000
    - run: "cat > /tmp/monitor-spec-mvp-python/check.sh <<'SH'\n#!/bin/sh\nset -e\nMONITOR_ISSUES_STORE=/tmp/monitor-spec-mvp-python/data/issues.veclite ./bin/monitor issues list --json > /tmp/monitor-spec-mvp-python/issues.json\npython3 -c \"\nimport json\nd = json.load(open('/tmp/monitor-spec-mvp-python/issues.json'))\nassert len(d) == 2, d\nfatal = [i for i in d if i['exception_type'] == 'RuntimeError']\nhandled = [i for i in d if i['exception_type'] == 'ValueError']\nassert len(fatal) == 1, d\nassert fatal[0]['occurrence_count'] == 1, fatal[0]\nassert fatal[0]['culprit']['function'] == 'detonate', fatal[0]\nassert fatal[0]['culprit']['line'] == 45, fatal[0]\nassert len(handled) == 1, d\nassert handled[0]['occurrence_count'] >= 1, handled[0]\nassert handled[0]['culprit']['function'] == 'flaky_parse', handled[0]\nassert handled[0]['culprit']['line'] == 31, handled[0]\nprint('ok')\n\"\nSH\nchmod +x /tmp/monitor-spec-mvp-python/check.sh"
      timeoutMs: 5000

steps:
  - wait:
      screen:
        contains: "workload: intentional uncaught failure"
      timeoutMs: 15000
  - wait:
      process:
        exitCode: 1
      timeoutMs: 15000

outcomes:
  - id: new_issue_banners_printed
    description: at least one NEW issue banner is printed
    verify:
      screen:
        contains: "monitor > NEW"
  - id: exit_code_propagated
    description: monitor's own exit code is python's uncaught-exception exit code (1)
    verify:
      process:
        exitCode: 1
  - id: two_grouped_issues_with_correct_culprits
    description: the handled ValueError repeats group into one issue and the fatal RuntimeError crash into a second, each with the right culprit
    verify:
      command:
        run: "/tmp/monitor-spec-mvp-python/check.sh"
