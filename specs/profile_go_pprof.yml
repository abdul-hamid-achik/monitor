version: 1
name: monitor_profile_go_pprof

intent: |
  `monitor profile <pid> --type cpu --pprof-addr <addr> --json` parses a real
  Go net/http/pprof CPU profile in-process (github.com/google/pprof/profile),
  with no dependency on the `go` toolchain being on PATH at capture time.
  Builds and runs examples/polyglot/go-pprof (a workload whose hot path is
  main.heavyStringify calling json.Marshal in a tight loop — see
  ~/notes/projects/monitor/2026-09-22-local-sentry-findings.md, "Go:
  main.heavyStringify NEVER appears" under the old goToolPprofTop/
  parsePprofTop path), captures a CPU profile of it, and asserts
  main.heavyStringify actually appears in the parsed symbols.

target:
  # preconditions already built the workload binary at
  # /tmp/monitor-spec-go-pprof/go-pprof; this just runs+profiles+kills it.
  cmd:
    [
      "sh",
      "-c",
      "/tmp/monitor-spec-go-pprof/go-pprof >/tmp/monitor-spec-go-pprof/stderr.log 2>&1 & P=$!; sleep 1; ./bin/monitor profile \"$P\" --type cpu --pprof-addr 127.0.0.1:6069 --duration 2s --json; R=$?; kill \"$P\" 2>/dev/null; exit $R",
    ]
  cwd: "."

terminal:
  cols: 120
  rows: 60
  profile: xterm-256color

preconditions:
  commands:
    - run: "test -x ./bin/monitor"
      timeoutMs: 5000
    - run: "command -v go"
      timeoutMs: 5000
    - run: "mkdir -p /tmp/monitor-spec-go-pprof && (cd examples/polyglot/go-pprof && go build -o /tmp/monitor-spec-go-pprof/go-pprof .)"
      timeoutMs: 60000

steps:
  - wait:
      process:
        exitCode: 0
      timeoutMs: 20000

outcomes:
  - id: type_cpu
    description: stdout marks the profile type as cpu
    verify:
      command:
        run: >-
          /tmp/monitor-spec-go-pprof/go-pprof >/tmp/monitor-spec-go-pprof/stderr.log 2>&1 &
          P=$!; sleep 1;
          ./bin/monitor profile "$P" --type cpu --pprof-addr 127.0.0.1:6069 --duration 2s --json 2>&1 > /tmp/monitor-spec-go-pprof/profile.json;
          kill "$P" 2>/dev/null;
          grep -q '"type":[[:space:]]*"cpu"' /tmp/monitor-spec-go-pprof/profile.json
  - id: path_saved
    description: the raw pprof proto is saved to a .pb.gz Path (go tool pprof can still open it independently)
    verify:
      command:
        run: >-
          /tmp/monitor-spec-go-pprof/go-pprof >/tmp/monitor-spec-go-pprof/stderr.log 2>&1 &
          P=$!; sleep 1;
          ./bin/monitor profile "$P" --type cpu --pprof-addr 127.0.0.1:6069 --duration 2s --json 2>&1 > /tmp/monitor-spec-go-pprof/profile.json;
          kill "$P" 2>/dev/null;
          grep -q '"path":[[:space:]]*".*\.pb\.gz"' /tmp/monitor-spec-go-pprof/profile.json
  - id: heavy_stringify_present
    description: main.heavyStringify (the planted hot path) appears among the parsed symbols
    verify:
      command:
        run: >-
          /tmp/monitor-spec-go-pprof/go-pprof >/tmp/monitor-spec-go-pprof/stderr.log 2>&1 &
          P=$!; sleep 1;
          ./bin/monitor profile "$P" --type cpu --pprof-addr 127.0.0.1:6069 --duration 2s --json 2>&1 > /tmp/monitor-spec-go-pprof/profile.json;
          kill "$P" 2>/dev/null;
          grep -q 'main.heavyStringify' /tmp/monitor-spec-go-pprof/profile.json
  - id: no_unknown_symbols
    description: no symbol is mislabeled "unknown" (the removed HasSuffix(fn,"s") bug this replaces)
    verify:
      command:
        run: >-
          /tmp/monitor-spec-go-pprof/go-pprof >/tmp/monitor-spec-go-pprof/stderr.log 2>&1 &
          P=$!; sleep 1;
          ./bin/monitor profile "$P" --type cpu --pprof-addr 127.0.0.1:6069 --duration 2s --json 2>&1 > /tmp/monitor-spec-go-pprof/profile.json;
          kill "$P" 2>/dev/null;
          ! grep -q '"func":[[:space:]]*"unknown"' /tmp/monitor-spec-go-pprof/profile.json
  - id: clean_exit
    description: the binary exits cleanly
    verify:
      command:
        run: >-
          /tmp/monitor-spec-go-pprof/go-pprof >/tmp/monitor-spec-go-pprof/stderr.log 2>&1 &
          P=$!; sleep 1;
          ./bin/monitor profile "$P" --type cpu --pprof-addr 127.0.0.1:6069 --duration 2s --json >/dev/null 2>&1;
          R=$?; kill "$P" 2>/dev/null; [ $R -eq 0 ]
