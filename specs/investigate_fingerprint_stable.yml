version: 1
name: monitor_investigate_fingerprint_stable

intent: |
  E1.6 (bug 11): recordInvestigateOccurrence must stop hashing the top-10
  sampled symbols. Five consecutive `monitor investigate <pid> --no-save`
  runs against the SAME live process (node --jitless --inspect on a free
  port, running examples/polyglot/js/workload.js) must group into ONE
  issue with occurrence_count 5 -- not five separate issues, which is what
  the old fingerprint (hashing whatever ended up in the sampled top-10,
  which reshuffles between runs) produced. Each run's issue.symbols must
  be exactly the single dominant in-app function (`heavyStringify`, well
  over the 15% threshold once its several hot lines are aggregated), never
  the old multi-symbol list.

  --jitless (pure V8 interpretation, no JIT inlining) is deliberate here,
  matching specs/profile_node_lines.yml's own documented workaround: under
  default JIT flags, V8 sometimes inlines heavyStringify into its caller
  mid-profile, which would make the DOMINANT symbol itself unstable across
  runs for reasons that have nothing to do with this fix.

  Runs an isolated MONITOR_ISSUES_STORE (and HOME/XDG_*_HOME, scoped to a
  subshell -- exporting a fake HOME for the rest of the command breaks this
  machine's asdf python3 shim resolution for any later `python3` call in
  the same process) so this never touches a real local issue store. The
  whole 5-run sequence takes ~30s (each CDP capture is a real 5s window);
  workload.js self-terminates at ~40s, so this launches ONCE in target.cmd
  (not once per outcome, which would blow well past that budget) and every
  outcome below just reads the files target.cmd already wrote. The actual
  assertions live in the outcomes (not target.cmd): a bare `python3 -c` as
  the LAST statement of target.cmd itself was observed to fail with "No
  version is set for command python3" on this machine even with no HOME
  override in play, while the identical call from an outcome's
  verify.command succeeds -- target.cmd and outcome verification apparently
  go through different exec paths here.

target:
  cmd:
    [
      "sh",
      "-c",
      "mkdir -p /tmp/monitor-spec-investigate-fp/home /tmp/monitor-spec-investigate-fp/data /tmp/monitor-spec-investigate-fp/state; ( export HOME=/tmp/monitor-spec-investigate-fp/home XDG_DATA_HOME=/tmp/monitor-spec-investigate-fp/data XDG_STATE_HOME=/tmp/monitor-spec-investigate-fp/state MONITOR_ISSUES_STORE=/tmp/monitor-spec-investigate-fp/data/issues.veclite; node --jitless --inspect=127.0.0.1:9412 examples/polyglot/js/workload.js >/tmp/monitor-spec-investigate-fp/node.log 2>&1 & P=$!; sleep 1; i=1; while [ \"$i\" -le 5 ]; do ./bin/monitor investigate \"$P\" --no-save --json > /tmp/monitor-spec-investigate-fp/run$i.json; i=$((i + 1)); done; kill \"$P\" 2>/dev/null ); MONITOR_ISSUES_STORE=/tmp/monitor-spec-investigate-fp/data/issues.veclite ./bin/monitor issues list --json > /tmp/monitor-spec-investigate-fp/issues.json; true",
    ]
  cwd: "."

terminal:
  cols: 200
  rows: 80
  profile: xterm-256color

preconditions:
  commands:
    - run: "test -x ./bin/monitor"
      timeoutMs: 5000
    - run: "command -v node"
      timeoutMs: 5000
    - run: "command -v python3"
      timeoutMs: 5000
    - run: "test -f examples/polyglot/js/workload.js"
      timeoutMs: 5000
    - run: "rm -rf /tmp/monitor-spec-investigate-fp"
      timeoutMs: 5000

steps:
  - wait:
      process:
        exitCode: 0
      timeoutMs: 60000

outcomes:
  # Every outcome below reads the files target.cmd already wrote (the
  # single 5-run sequence above, exit code already asserted the same
  # invariants) -- none of these re-launches node or re-runs investigate,
  # so they stay fast regardless of how many there are.
  - id: one_issue_occurrence_count_5
    description: all 5 runs grouped into exactly one issue with occurrence_count 5
    verify:
      command:
        run: "python3 -c \"import json;issues=json.load(open('/tmp/monitor-spec-investigate-fp/issues.json'));assert len(issues)==1, issues;assert issues[0]['occurrence_count']==5, issues[0]\""
  - id: dominant_symbol_is_heavystringify_not_top10
    description: issue.symbols is the single dominant in-app function, not a hashed top-10 list
    verify:
      command:
        run: "python3 -c \"import json;issues=json.load(open('/tmp/monitor-spec-investigate-fp/issues.json'));assert issues[0]['symbols']==['heavyStringify'], issues[0]['symbols']\""
  - id: every_run_verdict_complete
    description: all 5 individual investigate runs reported verdict complete (a real CDP capture each time, not a degraded fallback)
    verify:
      command:
        run: "python3 -c \"import json;runs=[json.load(open('/tmp/monitor-spec-investigate-fp/run%d.json' % i)) for i in range(1,6)];assert all(r.get('verdict')=='complete' for r in runs), [r.get('verdict') for r in runs]\""
  - id: every_run_used_inspector_cpu
    description: all 5 runs captured via the CDP inspector (file:line frames), not a pprof/sample fallback
    verify:
      command:
        run: "python3 -c \"import json;runs=[json.load(open('/tmp/monitor-spec-investigate-fp/run%d.json' % i)) for i in range(1,6)];assert all(r.get('profile_method')=='inspector_cpu' for r in runs), [r.get('profile_method') for r in runs]\""
  - id: same_issue_id_across_all_runs
    description: every run resolved to the identical issue ID (fingerprint stability, the core of bug 11)
    verify:
      command:
        run: "python3 -c \"import json;runs=[json.load(open('/tmp/monitor-spec-investigate-fp/run%d.json' % i)) for i in range(1,6)];ids={r['issue']['id'] for r in runs};assert len(ids)==1, ids\""
  - id: clean_exit
    description: the target scenario (5 investigate runs + issues list) exits cleanly
    verify:
      process:
        exitCode: 0
