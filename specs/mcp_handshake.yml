version: 1
name: monitor_mcp_handshake

intent: |
  `monitor mcp serve` runs an MCP stdio server. The handshake spec verifies:
  1. The server responds to `initialize` with the expected serverInfo + capabilities.
  2. `tools/list` enumerates the read-only tools (snapshot, processes, doctor,
     analyze, issues, issue)
     AND the mutating tools (kill, profile_capture, investigate, record).
  3. The mutating tools' typed input schemas require a `confirm: true` field.
  4. Standard MCP annotations label read-only, destructive, idempotent, and
     closed-world behavior for client approval UX.

target:
  cmd: ["sh", "-c", "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10"]
  cwd: "."

terminal:
  cols: 200
  rows: 80
  profile: xterm-256color

preconditions:
  commands:
    - run: "test -x ./bin/monitor"
      timeoutMs: 5000

steps:
  - wait:
      process:
        exited: true
      timeoutMs: 10000

# Verifier helper (referenced by every outcome below):
#   PROBE='{ printf "%s\n%s\n" "<init>" "<tools/list>"; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10'
# Each outcome invokes PROBE and greps / parses the captured output.

outcomes:
  - id: server_info
    description: initialize response includes monitor serverInfo with name field
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q '\"name\":\"monitor\"'"
  - id: instructions_mention_confirm
    description: server instructions warn that mutating tools require confirm:true
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q 'confirm: true'"
  - id: tool_monitor_kill_listed
    description: tools/list includes monitor_kill
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q '\"name\":\"monitor_kill\"'"
  - id: tool_monitor_profile_capture_listed
    description: tools/list includes monitor_profile_capture
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q '\"name\":\"monitor_profile_capture\"'"
  - id: tool_monitor_investigate_listed
    description: tools/list includes monitor_investigate
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q '\"name\":\"monitor_investigate\"'"
  - id: tool_monitor_record_listed
    description: tools/list includes monitor_record
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q '\"name\":\"monitor_record\"'"
  - id: tool_monitor_snapshot_listed
    description: tools/list still includes monitor_snapshot (read-only tool preserved)
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q '\"name\":\"monitor_snapshot\"'"
  - id: tool_monitor_analyze_listed
    description: tools/list includes the read-only monitor_analyze tool
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q '\"name\":\"monitor_analyze\"'"
  - id: tool_monitor_issues_listed
    description: tools/list includes the read-only monitor_issues tool
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q '\"name\":\"monitor_issues\"'"
  - id: tool_monitor_issue_listed
    description: tools/list includes the read-only monitor_issue detail tool
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | grep -q '\"name\":\"monitor_issue\"'"
  - id: kill_schema_requires_confirm
    description: monitor_kill inputSchema marks confirm as required
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | python3 -c 'import json,sys; line=[l for l in sys.stdin if l.strip().startswith(\"{\") and \"monitor_kill\" in l][-1]; t=json.loads(line); kill=[x for x in t[\"result\"][\"tools\"] if x[\"name\"]==\"monitor_kill\"][0]; req=kill[\"inputSchema\"].get(\"required\",[]); assert \"confirm\" in req, f\"confirm not in required: {req}\"; print(\"ok\")'"
  - id: tool_safety_annotations
    description: tools/list labels read-only tools and the destructive kill action
    verify:
      command:
        run: "{ printf '%s\\n%s\\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"probe\",\"version\":\"0.0.1\"}}}' '{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/list\"}'; sleep 0.3; } | ./bin/monitor mcp serve 2>&1 | head -10 | python3 -c 'import json,sys; line=[l for l in sys.stdin if l.strip().startswith(\"{\") and \"monitor_kill\" in l][-1]; tools={x[\"name\"]:x for x in json.loads(line)[\"result\"][\"tools\"]}; ro=(\"monitor_snapshot\",\"monitor_processes\",\"monitor_doctor\",\"monitor_analyze\",\"monitor_issues\",\"monitor_issue\"); assert all(tools[n][\"annotations\"].get(\"readOnlyHint\") is True and tools[n][\"annotations\"].get(\"openWorldHint\") is False for n in ro); kill=tools[\"monitor_kill\"][\"annotations\"]; assert kill.get(\"destructiveHint\") is True and kill.get(\"idempotentHint\",False) is False and kill.get(\"openWorldHint\") is False; assert all(tools[n][\"annotations\"].get(\"destructiveHint\") is False for n in (\"monitor_profile_capture\",\"monitor_investigate\",\"monitor_record\"))'"
