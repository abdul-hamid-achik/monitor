version: 1
name: monitor_reload

intent: |
  `monitor studio --reload-server` starts a localhost HTTP /reload endpoint
  alongside the TUI, and `monitor reload` POSTs to it. This behavioral spec
  locks the CLI contract in a headless-safe way; reload server/model delivery
  is covered by the reload and Studio unit tests.

target:
  cmd: ["./bin/monitor", "reload", "--help"]
  cwd: "."

terminal:
  cols: 120
  rows: 40
  profile: xterm-256color

preconditions:
  commands:
    - run: "test -x ./bin/monitor"
      timeoutMs: 5000

steps:
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: help_describes_reload
    description: monitor reload --help explains the trigger behavior
    verify:
      command:
        run: "./bin/monitor reload --help 2>&1 | grep -qE '127\\.0\\.0\\.1:7351|reload endpoint'"
  - id: help_has_addr_flag
    description: monitor reload --help documents the --addr flag
    verify:
      command:
        run: "./bin/monitor reload --help 2>&1 | grep -qE '\\-\\-addr'"
  - id: help_lists_timeout
    description: monitor reload --help documents the --timeout flag
    verify:
      command:
        run: "./bin/monitor reload --help 2>&1 | grep -qE '\\-\\-timeout'"
  - id: clean_exit
    description: monitor reload --help exits cleanly
    verify:
      process:
        exitCode: 0
