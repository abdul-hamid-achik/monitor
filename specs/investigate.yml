version: 1
name: monitor_investigate

intent: |
  `monitor investigate <pid> --json` runs the diagnostic pipeline
  (snapshot -> profile -> correlate -> stash) and returns JSON with the PID,
  start time, an ordered list of typed per-step results ({step, status,
  limitation, recovery}), and an overall verdict of "complete" or "partial"
  (complete iff no step failed). Uses PID 1 (launchd) which is always present
  on macOS and is not killed by investigate; launchd exposes no pprof server
  and macOS `sample` needs root to attach to another user's process, so this
  spec expects verdict "partial" in the sandboxed CI environment — do NOT
  assert a specific verdict value, only that the field is present.

target:
  cmd: ["./bin/monitor", "investigate", "1", "--json"]
  cwd: "."

terminal:
  cols: 120
  rows: 60
  profile: xterm-256color

preconditions:
  commands:
    - run: "test -x ./bin/monitor"
      timeoutMs: 5000

steps:
  - wait:
      process:
        exitCode: 0
      timeoutMs: 10000

outcomes:
  - id: pid_echoed
    description: stdout includes the investigated pid
    verify:
      command:
        run: "./bin/monitor investigate 1 --json | grep -q '\"pid\":[[:space:]]*1'"
  - id: started_at_present
    description: stdout includes the started_at timestamp
    verify:
      command:
        run: "./bin/monitor investigate 1 --json | grep -q '\"started_at\"'"
  - id: steps_array
    description: stdout includes a steps array naming the pipeline stages
    verify:
      command:
        run: "./bin/monitor investigate 1 --json | grep -q '\"steps\"'"
  - id: note_field
    description: stdout includes a note describing the pipeline stage
    verify:
      command:
        run: "./bin/monitor investigate 1 --json | grep -q '\"note\"'"
  - id: clean_exit
    description: the binary exits cleanly
    verify:
      process:
        exitCode: 0
  - id: verdict_present
    description: stdout includes the overall complete|partial verdict
    verify:
      command:
        run: "./bin/monitor investigate 1 --json | grep -q '\"verdict\"'"
  - id: typed_steps
    description: steps carry per-step status objects, not bare strings
    verify:
      command:
        run: "./bin/monitor investigate 1 --json | grep -q '\"status\"'"
