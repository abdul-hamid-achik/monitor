version: 1
name: monitor_env_detection

intent: |
  `monitor run` injects MONITOR=1 and a real MONITOR_RUN_DIR into the glyphrun
  process. A fake glyph binary observes the exact child environment, so this
  checks Monitor's launcher instead of pre-seeding the variables in the spec.

target:
  cmd:
    - "/bin/sh"
    - "-lc"
    - |
      d="$(mktemp -d)"
      trap 'rm -rf "$d"' EXIT
      printf '%s\n' '#!/bin/sh' 'if [ "$MONITOR" = "1" ] && [ -n "$MONITOR_RUN_DIR" ] && [ -d "$MONITOR_RUN_DIR" ]; then echo DETECTED; else echo MISSING; exit 9; fi' > "$d/glyph"
      chmod +x "$d/glyph"
      PATH="$d:$PATH" exec ./bin/monitor run specs/version.yml
  cwd: "."

terminal:
  cols: 100
  rows: 30
  profile: xterm-256color

steps:
  - wait:
      screen:
        contains: "DETECTED"
      timeoutMs: 5000
  - wait:
      process:
        exitCode: 0
      timeoutMs: 5000

outcomes:
  - id: env_detected
    description: the child observes MONITOR=1 and a live MONITOR_RUN_DIR
    verify:
      screen:
        contains: "DETECTED"
  - id: clean_exit
    description: process exits 0
    verify:
      process:
        exitCode: 0
