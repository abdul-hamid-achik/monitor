version: '3'

silent: false

vars:
  BINARY: bin/monitor

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the monitor binary
    cmds:
      - go build -o {{.BINARY}} ./cmd/monitor

  release:
    desc: Build optimized release binary
    cmds:
      - go build -ldflags="-s -w" -o {{.BINARY}} ./cmd/monitor

  run:
    desc: Build and run the monitor TUI
    deps: [build]
    cmds:
      - ./{{.BINARY}}

  dev:
    desc: Development mode with auto-reload on file changes
    watch: true
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    cmds:
      - go build -o {{.BINARY}} ./cmd/monitor
      - ./{{.BINARY}}

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  cover:
    desc: Run tests and generate HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - 'echo "Coverage report: coverage.html"'

  bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem ./...

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go source files
    cmds:
      - gofmt -w .

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts and coverage files
    cmds:
      - rm -rf bin/ coverage.out coverage.html

  install:
    desc: Install monitor to /usr/local/bin
    deps: [release]
    cmds:
      - sudo cp {{.BINARY}} /usr/local/bin/monitor

  remove:
    desc: Remove monitor from /usr/local/bin
    cmds:
      - sudo rm -f /usr/local/bin/monitor

  version:
    desc: Show Go and module versions
    cmds:
      - go version
      - go list -m all | grep -E "bubbletea|bubbles|lipgloss|gopsutil|cobra|mcp"

  specs:
    desc: Run all glyphrun behavioral specs
    cmds:
      - |
        for spec in specs/*.yml; do
          echo "--- Running $spec ---"
          glyph run "$spec" || echo "SKIP: glyph not installed"
          break
        done
      - echo "Specs complete."

  snapshot:
    desc: Emit a one-shot JSON system snapshot
    deps: [build]
    cmds:
      - ./{{.BINARY}} snapshot --json

  doctor:
    desc: Run ecosystem health check
    deps: [build]
    cmds:
      - ./{{.BINARY}} doctor --json

  info:
    desc: Show project information
    cmds:
      - 'echo "Monitor - local-first observability tool for macOS"'
      - 'echo "Binary: {{.BINARY}}"'
      - 'ls -lh {{.BINARY}} 2>/dev/null || echo "Status: not built"'

  help:
    desc: Show help and quick start guide
    cmds:
      - 'echo "Monitor CLI - Taskfile Help"'
      - echo "=========================="
      - echo ""
      - echo "Quick Start:"
      - echo "  task build    — Build the application"
      - echo "  task run      — Build and run the TUI"
      - echo "  task dev      — Development mode with watch"
      - echo ""
      - echo "Testing:"
      - echo "  task test     — Run all tests"
      - echo "  task cover    — Generate coverage report"
      - echo "  task bench    — Run benchmarks"
      - echo "  task specs    — Run glyphrun behavioral specs"
      - echo ""
      - echo "Quality:"
      - echo "  task lint     — Run go vet"
      - echo "  task fmt      — Format source files"
      - echo "  task tidy     — Tidy go modules"
      - echo ""
      - echo "CLI:"
      - echo "  task snapshot — Print JSON system snapshot"
      - echo "  task doctor   — Check ecosystem tool health"
      - echo ""
      - echo "Deployment:"
      - echo "  task install  — Install to /usr/local/bin"
      - echo "  task remove   — Remove from /usr/local/bin"
      - echo "  task clean    — Remove build artifacts"
      - echo ""
      - echo "Run 'task --list' for all available tasks"

  check:
    desc: Full CI pipeline (tidy, lint, test, release)
    deps: [tidy, lint, test, release]
    cmds:
      - 'echo "All checks passed!"'

  all:
    desc: Alias for check — full CI pipeline
    aliases: [check]
    deps: [tidy, lint, test, release]
    cmds:
      - 'echo "All checks passed!"'