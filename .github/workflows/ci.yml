name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: build
        run: go build -o bin/monitor ./cmd/monitor

  specs:
    name: glyphrun specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # glyphrun requires Go 1.26. The test matrix above stays on
          # Go 1.25 so Monitor's declared minimum remains continuously tested.
          go-version: "1.26"
          cache: true

      # Runtime specs (mvp_errors_*, hot_*, run_*) launch real node/deno/bun/
      # python/ruby workloads, so every interpreter monitor supports has to be
      # on PATH here, not just Go.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.x"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"

      - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
        with:
          ruby-version: "3.4"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install glyph (glyphrun)
        run: |
          go install github.com/abdul-hamid-achik/glyphrun/cmd/glyph@v0.20.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build monitor
        run: go build -o bin/monitor ./cmd/monitor

      - name: Run specs
        run: scripts/specs.sh
