[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorcli"
version = "0.1.0"
description = "Monitor's own error SDK for Python: zero dependencies, local-first, writes monitor.event.v1 files for the monitor CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://monitorcli.dev/guide/sdks"
Source = "https://github.com/abdul-hamid-achik/monitor/tree/main/sdk/python"

[tool.setuptools]
packages = ["monitorcli"]
